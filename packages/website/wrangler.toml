name = "paseo-pontifex-website"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = "./src/server-entry.ts"

# Deploy to the workers.dev hostname owned by CLOUDFLARE_ACCOUNT_ID.
workers_dev = true

[observability]
enabled = true

# The website treats WEBSITE_CACHE as optional. Add a KV namespace here after
# creating one in your own Cloudflare account if you want caching.
