name = "paseo-pontifex-relay"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

# Deploy to the workers.dev hostname owned by CLOUDFLARE_ACCOUNT_ID.
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
