name: Nix Update Hash

on:
  # Manual only. This workflow commits back to the selected branch, so it must
  # never run as a side effect of an upstream sync.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Commit hash/lockfile updates
        run: |
          git diff --quiet package-lock.json nix/npm-deps.hash && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json nix/npm-deps.hash
          git commit -m "chore: update lockfile signatures and Nix hash [skip ci]"
          git push
